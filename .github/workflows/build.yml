name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install crystal cmake pkgconf jq openssl bdw-gc pcre2 libyaml unibilium ameba

      - name: Build and test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            docker run --rm --pull always -v "$PWD:/workspace" -w /workspace \
              crystallang/crystal:latest-alpine sh -ec \
              'apk add --no-cache bash build-base cmake curl jq pkgconf git binutils \
                openssl-dev openssl-libs-static gc-dev gc-static pcre2-dev pcre2-static \
                yaml-dev yaml-static zlib-dev zlib-static unibilium-dev ncurses-terminfo-base
               exec bash .github/scripts/build.sh'
            # Run outside Alpine as well, to catch runtime dependencies.
            binary=$(find dist -type f -name minknow-tui -print -quit)
            "$binary" --version
            "$binary" --help
          else
            bash .github/scripts/build.sh
          fi

      - uses: actions/upload-artifact@main
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
